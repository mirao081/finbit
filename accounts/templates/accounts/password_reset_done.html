{% extends "accounts/dashboard_base.html" %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'accounts/css/password_reset.css' %}">
{% endblock %}

{% block content %}
<section class="reset-page">

    <div class="reset-card success-card">

        <div class="success-icon">
            <i class="fas fa-envelope-circle-check"></i>
        </div>

        <h2>Check Your Email</h2>

        <p>We've sent password reset instructions to your recovery email.</p>

        <div class="info-box">
            <i class="fas fa-clock"></i>
            The reset link may take a few minutes to arrive.
        </div>

    </div>

</section>
{% endblock %}
