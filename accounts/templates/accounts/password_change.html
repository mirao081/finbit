{% extends "accounts/dashboard_base.html" %}
{% load static %}

{% block content %}

<link rel="stylesheet" href="{% static 'accounts/css/security_center.css' %}">

<section class="security-page">

    <div class="password-card">

        <div class="security-heading">

            <h2>Change Password</h2>

            <p>
                Create a strong new password to keep your
                Finbit account secure.
            </p>

        </div>

        <form method="post">

            {% csrf_token %}

            {{ form.as_p }}

            <button
                type="submit"
                class="security-btn warning"
            >
                Update Password
            </button>

        </form>

        <div style="margin-top:18px;">

            <a
                href="{% url 'security_center' %}"
                class="security-btn secondary"
            >
                Cancel
            </a>

        </div>

    </div>

</section>

{% endblock %}
