{% extends "accounts/dashboard_base.html" %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'accounts/css/wallets.css' %}">
{% endblock %}

{% block content %}
<section class="confirm-delete-page">
    <div class="confirm-delete-card">

        <div class="delete-icon">
            <i class="fas fa-trash-alt"></i>
        </div>

        <h4>Delete Wallet</h4>

        <p>
            Are you sure you want to permanently delete your
            <strong>{{ wallet.get_currency_display }}</strong> wallet?
        </p>

        <form method="post" class="confirm-delete-form">
            {% csrf_token %}

            <button type="submit" class="wallet-btn delete-btn">
                <i class="fas fa-trash"></i>
                Yes, Delete
            </button>

            <a href="{% url 'wallets' %}" class="wallet-btn cancel-btn">
                <i class="fas fa-times"></i>
                Cancel
            </a>
        </form>

    </div>
</section>
{% endblock %}
