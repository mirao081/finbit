{% extends 'control/admin_base.html' %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'control/css/update_plan.css' %}">
{% endblock %}

{% block content %}
<div class="update-plan-page">
    <h2>Update Plan: {{ plan.name }}</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save Changes</button>
    </form>
</div>
{% endblock %}
